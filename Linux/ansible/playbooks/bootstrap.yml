- name: Bootstrap machine for local Ansible runs
  hosts: local
  gather_facts: true
  tasks:
    - name: Confirm supported operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
        fail_msg: This automation currently targets Ubuntu only.

